openapi: 3.0.0

servers:
  - url: ./

info:
  title: opensvc feeder api
  version: 3.0.5

paths:
  /daemon/ping:
    post:
      description: |
        Refresh cluster daemon status timestamps
      operationId: PostDaemonPing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDaemonPing'
      responses:
        202:
          $ref: '#/components/responses/DaemonPingAccepted'
        204:
          description: missing daemon status for node, POST /daemon/status is required
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /daemon/status:
    post:
      description: |
        Refresh cluster daemon status
      operationId: PostDaemonStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDaemonStatus'
      responses:
        202:
          $ref: '#/components/responses/DaemonStatusAccepted'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /openapi.json:
    get:
      operationId: GetSwagger
      tags:
        - public
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'

  /node/actionq:
    get:
      description: |
        get the actions queued for the authenticated node
      operationId: GetNodeActionQueued
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedActions'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /node/actionq/running:
    post:
      description: |
        the node acknowledges receipt and will run the following action ids list.
      operationId: PostNodeActionQueuedRunning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueuedActionRunning'
      responses:
        202:
          description: accepted
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /node/actionq/done:
    post:
      description: |
        set actions queued received by the node
      operationId: PostNodeActionQueuedDone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueuedActionDone'
      responses:
        202:
          description: accepted
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /node/checks:
    post:
      description: |
        Replace the checks of the node with the results of its check
        drivers: the checks the node no longer reports are removed.
      operationId: PostNodeChecks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeChecks'
      responses:
        202:
          description: the checks of the node will be refreshed
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /node/disk:
    post:
      description: |
        Update or create node disks configuration
      operationId: PostNodeDisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeDisks'
      responses:
        202:
          description: node disks configuration will be refreshed
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /node/stats:
    post:
      description: |
        Store the performance statistics of the node, as the historical collector
        stored the ones pushed by the agent pushstats action (insert_stats): one
        whisper file per metric under stats/nodes/<node_id>/<group>, with one
        directory per cpu, device, interface or mount point for the groups
        having one. The agent sends, per group, the columns and the rows sar or
        its own probes gave. The values are written at once: a successful answer
        tells what was stored.
      operationId: PostNodeStats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeStats'
      responses:
        200:
          description: the statistics are stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeStatsStored'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /node/system:
    post:
      description: |
        Post system discovery
      operationId: PostSystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/system'
      responses:
        202:
          description: system data will be refreshed for node
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /node/sysreport:
    post:
      description: |
        Post node sysreport
      operationId: PostNodeSysReport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SysReport'
      responses:
        202:
          description: sysreport accepted
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /instance/action:
    put:
      description: |
        End an action for a given object path
      operationId: PutInstanceActionEnd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Action'
      responses:
        202:
          description: action end accepted
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent
    post:
      description: |
        Begin an action for a given object path
      operationId: PostInstanceAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Action'
      responses:
        202:
          description: action begin accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRequestAccepted'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /instance/resource_info:
    post:
      description: |
        Update or create instance resource info
      operationId: PostInstanceResourceInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceResourceInfo'
      responses:
        202:
          description: instance resource information will be refreshed
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /instance/status:
    post:
      description: |
        Store opensvc 2.1 instance status data.
      operationId: PostInstanceStatus
      parameters:
        - $ref: '#/components/parameters/inQuerySync'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceStatus'
      responses:
        200:
          description: instance status stored successfully (synchronous)
        202:
          description: instance status refreshed accepted (asynchronous)
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /object/config:
    post:
      description: |
        Update or create object configuration
      operationId: PostObjectConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectConfig'
      responses:
        202:
          description: instance configuration will be refreshed
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /sanswitch:
    post:
      description: |
        Update the configuration of a SAN switch, as the agent inventoried it:
        the raw outputs of the switch commands, which the worker parses into
        the switches, zones and aliases tables. A node inventories the
        switches its configuration declares, on the schedule of each.
      operationId: PostSANSwitch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SANSwitch'
      responses:
        202:
          description: the switch configuration will be refreshed
        400:
          $ref: '#/components/responses/400'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - agent

  /version:
    get:
      operationId: GetVersion
      description: return api version
      tags:
        - capabilities
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/version'
        500:
          $ref: '#/components/responses/500'

components:
  schemas:
    Disk:
      type: object
      required:
        - id
        - object_path
        - size
        - used
        - vendor
        - model
        - dg
      properties:
        id:
          type: string
        object_path:
          type: string
        size:
          type: integer
          format: int32
        used:
          type: integer
        vendor:
          type: string
        model:
          type: string
        dg:
          type: string
        region:
          type: string

    ReportedNodename:
      type: string
      description: |
        The node the data is about, when the request is sent on its behalf
        by another node of its cluster, as the om3 collector speaker does.
        Defaults to the authenticated node. A node out of the cluster of the
        authenticated node is refused.

    InstanceResourceInfo:
      type: object
      required:
        - path
        - info
      properties:
        path:
          type: string
        nodename:
          $ref: '#/components/schemas/ReportedNodename'
        topology:
          type: string
        info:
          type: array
          items:
            type: object
            required:
              - rid
              - keys
            properties:
              rid:
                type: string
              keys:
                type: array
                items:
                  type: object
                  required:
                    - key
                    - value
                  properties:
                    key:
                      type: string
                    value: {}

    InstanceStatus:
      type: object
      required:
        - path
        - data
        - version
      properties:
        path:
          type: string
        data:
          type: object
        version:
          type: string
          description: the opensvc client data version

    ActionRequestAccepted:
      type: object
      required:
        - uuid
      properties:
        uuid:
          type: string

    Action:
      type: object
      description: |
        The begin or end action request
      required:
        - path
        - action
        - argv
        - pid
        - rids
        - origin
        - version
        - cron
        - uuid
        - session_uuid
        - begin
        - end
        - status
        - status_log
        - lines
      properties:
        path:
          type: string
        nodename:
          $ref: '#/components/schemas/ReportedNodename'
        action:
          type: string
        argv:
          type: array
          items:
            type: string
          description: the command line arguments
        pid:
          description: action pid
          type: string
        rids:
          description: the action resolved rids
          type: string
        origin:
          type: string
        version:
          type: string
          description: the opensvc client data version
        cron:
          type: boolean
        uuid:
          description: action uuid that have been assigned during the action begin
          type: string
        session_uuid:
          type: string
        begin:
          type: string
          description: begin action timestamp in RFC3339Nano format
        end:
          type: string
          description: end action timestamp in RFC3339Nano format
        status:
          type: string
          description: action status
        status_log:
          description: describe the command line
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ActionLine'

    ActionLine:
      type: object
      required:
        - begin
        - rid
        - subset
        - pid
        - status_log
        - status
      properties:
        begin:
          type: string
          description: begin action timestamp
        rid:
          type: string
        subset:
          type: string
        pid:
          description: the action line pid if meaningful
          type: string
        status:
          type: string
        status_log:
          type: string

    QueuedActions:
      type: object
      required:
        - actions
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/QueuedAction'

    QueuedAction:
      type: object
      required:
        - id
        - queued_at
        - dequeued_at
        - svc_id
        - svcname
        - nodename
        - command
        - status
      properties:
        id:
          type: integer
        queued_at:
          type: string
          format: date-time
        dequeued_at:
          type: string
          format: date-time
        svc_id:
          type: string
        svcname:
          type: string
        nodename:
          type: string
        command:
          type: string
        status:
          type: string

    NodeStats:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: |
            The statistics, by group: cpu, mem_u, swap, proc, block, blockdev,
            netdev, netdev_err, fs_u, svc. An unknown group is refused.
          additionalProperties:
            $ref: '#/components/schemas/NodeStatsGroup'

    NodeStatsGroup:
      type: object
      required:
        - columns
        - rows
      properties:
        columns:
          type: array
          description: |
            The names of the values of each row. The "date" column dates the
            row; the cpu, dev, mntpt or svcname column, for the groups having
            one, says the directory it goes in; nodename is ignored; every other
            column is a metric.
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            description: |
              The values, in the order of the columns. The date is RFC 3339, or
              "YYYY-MM-DD HH:MM:SS" in the collector time zone as the historical
              agent sends it; a metric value that is not a number is skipped.
            items:
              type: string

    NodeStatsStored:
      type: object
      required:
        - series
        - points
      properties:
        series:
          type: integer
          description: The whisper files written.
        points:
          type: integer
          description: The values written.
        skipped:
          type: array
          description: What was not stored, and why.
          items:
            type: string

    NodeChecks:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NodeCheck'
        partial:
          type: boolean
          description: >
            A checker failed during the run, so the data misses some of the
            checks the node has. The checks reported are updated, and the
            others are kept, with their alerts, where a complete feed
            removes them.

    NodeCheck:
      type: object
      required:
        - type
        - instance
        - value
      properties:
        type:
          type: string
          description: The type of the check, as fs_u or mpath.
        driver:
          type: string
          description: The driver of the check type that reported it.
        path:
          type: string
          description: The object the check is attributed to, empty for the node.
        instance:
          type: string
          description: What the check measures, as a mount point or a wwid.
        unit:
          type: string
        value:
          type: integer
          format: int64

    NodeDisks:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Disk'

    SANSwitch:
      type: object
      required:
        - name
        - type
        - data
      properties:
        name:
          type: string
          description: the name the agent reaches the switch with
        type:
          type: string
          enum:
            - brocade
          description: the driver of the switch, which says how data is read
        data:
          type: object
          additionalProperties:
            type: string
          description: |
            the raw output of each switch command, by command name. For a
            brocade: switchshow, nsshow and zoneshow.

    ObjectConfig:
      type: object
      required:
        - path
      properties:
        path:
          type: string
        orchestrate:
          type: string
        topology:
          type: string
        scope:
          type: array
          items:
            type: string
        drp_node:
          type: string
        drp_nodes:
          type: array
          items:
            type: string
        flex_min:
          type: integer
        flex_max:
          type: integer
        flex_target:
          type: integer
        monitored_resource_count:
          type: integer
        app:
          type: string
        env:
          type: string
        comment:
          type: string
        raw_config:
          type: string
          format: byte

    QueuedActionRunning:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: list of queued action ids
          items:
            type: integer
            description: a queued action id

    QueuedActionDone:
      type: object
      description: |
        the action queued result processed by the node
      required:
        - id
        - dequeued_at
        - ret
        - stdout
        - stderr
      properties:
        id:
          type: integer
        ret:
          type: integer
        dequeued_at:
          type: string
          format: date-time
        stdout:
          type: string
        stderr:
          type: string

    PostDaemonPing:
      type: object
      required:
        - nodes
        - objects
        - version
      properties:
        nodes:
          type: array
          description: list of cluster node
          items:
            type: string
            description: cluster node name
        objects:
          type: array
          description: list of cluster object names
          items:
            type: string
            description: object name
        version:
          type: string
          description: the opensvc client data version

    PostDaemonStatus:
      type: object
      required:
        - data
        - changes
        - version
      properties:
        previous_updated_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        data:
          type: object
        changes:
          type: array
          items:
            type: string
            description: object or instance
        version:
          type: string
          description: the opensvc client data version

    Problem:
      type: object
      properties:
        text:
          description: |
            A human-readable explanation specific to this occurrence of the
            problem.
          type: string
      required:
        - text

    system:
      type: object
      properties:
        package:
          type: array
          items:
            $ref: '#/components/schemas/package'

    package:
      type: object
      required:
        - name
        - version
        - arch
        - type
        - sig
      properties:
        name:
          type: string
        version:
          type: string
        arch:
          type: string
        type:
          type: string
        sig:
          type: string
        installed_at:
          type: string
          format: date-time

    version:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          example: "0.0.1"

    SysReport:
      type: object
      properties:
        deleted:
          type: array
          items:
            type: string
          description: |
            the tracked files deleted on the node since its last report, as
            their paths on the node
        file:
          type: string
          format: binary
          description: |
            a tar of the files and command outputs changed since the last
            report, each member named <nodename>/file/<path> or
            <nodename>/cmd/<name>. A report of deletions only has none.
        full:
          type: boolean
          description: |
            the archive holds every file and command output of the node: the
            ones the collector holds for the node and the archive does not
            are removed

  parameters:
    ObjectPathHeader:
      name: OC3-ObjectPath
      in: header
      schema:
        type: string

    inQuerySync:
      in: query
      name: sync
      schema:
        type: boolean

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '408':
      description: Request Timeout
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '503':
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"

    DaemonPingAccepted:
      description: daemon status timestamps will be refreshed for node
      content:
        application/json:
          schema:
            type: object
            properties:
              object_without_config:
                type: array
                description: list of object names that requires POST /api/object/config
                items:
                  type: string
                  description: object name
              node_with_action_queued:
                type: array
                description: list of cluster nodes with pending queued actions
                items:
                  type: string
                  description: cluster nodename

    DaemonStatusAccepted:
      description: daemon status will be refreshed for node
      content:
        application/json:
          schema:
            type: object
            properties:
              object_without_config:
                type: array
                description: list of object names that requires POST /api/object/config
                items:
                  type: string
                  description: object name
              node_with_action_queued:
                type: array
                description: list of cluster nodes with pending queued actions
                items:
                  type: string
                  description: cluster nodename
